name: NewAPI 自动签到

on:
  # 每天 UTC 00:00 = 北京时间 08:00
  schedule:
    - cron: '0 0 * * *'
  # 手动触发
  workflow_dispatch:

# 避免手动触发与定时任务同时签到
concurrency:
  group: newapi-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 系统 Chrome 不可用时作为兜底浏览器
      - name: 安装备用 Chromium
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 执行签到（xvfb 虚拟显示，含 Turnstile 自动解验证）
        env:
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
        run: xvfb-run --auto-servernum python checkin.py
